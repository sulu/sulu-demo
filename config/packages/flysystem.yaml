# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
# Sulu media storage runs through flysystem since Sulu 3.0. The directory keeps the path the
# media was stored under before the upgrade so existing files stay reachable.
flysystem:
    storages:
        default.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/var/uploads/media'

